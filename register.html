<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Biryani House | Register</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#070d13;
    color:#fff;
}

/* NAVBAR */

.navbar{
    height:70px;
    background:#0b121a;
    border-bottom:1px solid #273440;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 7%;
}

.logo{
    color:#ffc107;
    font-size:24px;
    font-weight:bold;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:25px;
}

.nav-links a{
    color:#ddd;
    text-decoration:none;
    font-size:14px;
}

.nav-links a:hover{
    color:#ffc107;
}


/* REGISTER AREA */

.register-section{
    min-height:calc(100vh - 70px);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:35px 20px;
}

.register-box{
    width:100%;
    max-width:450px;
    background:#0b121a;
    border:1px solid #273440;
    border-radius:12px;
    padding:35px;
    box-shadow:0 0 30px rgba(255,193,7,0.08);
}

.register-title{
    text-align:center;
    margin-bottom:25px;
}

.register-title .icon{
    font-size:42px;
    margin-bottom:8px;
}

.register-title h1{
    color:#ffc107;
    font-size:30px;
    margin-bottom:8px;
}

.register-title p{
    color:#999;
    font-size:14px;
}


/* FORM */

.form-group{
    margin-bottom:17px;
}

.form-group label{
    display:block;
    color:#ddd;
    font-size:14px;
    margin-bottom:7px;
}

.form-group input{
    width:100%;
    padding:13px;
    background:#070d13;
    color:#fff;
    border:1px solid #273440;
    border-radius:6px;
    outline:none;
    font-size:14px;
}

.form-group input:focus{
    border-color:#ffc107;
    box-shadow:0 0 8px rgba(255,193,7,0.15);
}


/* REGISTER BUTTON */

.register-btn{
    width:100%;
    padding:13px;
    margin-top:5px;
    background:#ffc107;
    color:#000;
    border:none;
    border-radius:6px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.register-btn:hover{
    background:#ffca28;
}


/* LOGIN LINK */

.login-text{
    text-align:center;
    color:#999;
    font-size:14px;
    margin-top:22px;
}

.login-text a{
    color:#ffc107;
    text-decoration:none;
    font-weight:bold;
}

.login-text a:hover{
    text-decoration:underline;
}


/* BACK */

.back-menu{
    display:block;
    text-align:center;
    margin-top:17px;
    color:#aaa;
    text-decoration:none;
    font-size:13px;
}

.back-menu:hover{
    color:#ffc107;
}


/* MOBILE */

@media(max-width:700px){

    .navbar{
        padding:0 4%;
    }

    .logo{
        font-size:19px;
    }

    .nav-links{
        gap:12px;
    }

    .nav-links a{
        font-size:11px;
    }

    .register-box{
        padding:25px 20px;
    }

}

</style>
</head>

<body>


<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">
        🔥 Biryani House
    </div>

    <div class="nav-links">

        <a href="index.html">Home</a>

        <a href="main.html">Menu</a>

        <a href="contact.html">Contact</a>

        <a href="cart.html">🛒 Cart</a>

        <a href="login.html">Login</a>

    </div>

</nav>


<!-- REGISTER -->

<section class="register-section">

    <div class="register-box">

        <div class="register-title">

            <div class="icon">📝</div>

            <h1>Create Account</h1>

            <p>Register your Biryani House account</p>

        </div>


        <form id="registerForm">


            <!-- NAME -->

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    maxlength="10"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                class="register-btn">

                Create Account

            </button>

        </form>


        <div class="login-text">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>


        <a href="main.html" class="back-menu">
            ← Back to Menu
        </a>

    </div>

</section>


<script>

document
.getElementById("registerForm")
.addEventListener("submit", function(event){

    event.preventDefault();


    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    /* CHECK PASSWORD */

    if(password !== confirmPassword){

        alert("Passwords do not match!");

        return;
    }


    /* SAVE DEMO USER */

    const user = {

        name:name,

        email:email,

        phone:phone,

        password:password

    };


    localStorage.setItem(
        "biryaniUser",
        JSON.stringify(user)
    );


    alert("Registration successful!");


    /* GO TO LOGIN */

    window.location.href = "login.html";

});

</script>

</body>
</html>
