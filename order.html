<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Biryani House | Orders</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#070d13;
    color:#fff;
    min-height:100vh;
}

nav{
    height:70px;
    background:#0b121a;
    border-bottom:1px solid #273440;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 7%;
}

.logo{
    font-size:24px;
    font-weight:bold;
    color:#ffc107;
}

.logo span{
    color:#fff;
}

.nav-links{
    display:flex;
    gap:25px;
}

.nav-links a{
    color:#ddd;
    text-decoration:none;
    font-size:14px;
}

.nav-links a:hover{
    color:#ffc107;
}

.cart{
    color:#fff;
    text-decoration:none;
}

.cart span{
    color:#ffc107;
    font-weight:bold;
}

.container{
    width:90%;
    max-width:900px;
    margin:45px auto;
}

.title{
    text-align:center;
    margin-bottom:35px;
}

.title h1{
    color:#ffc107;
    font-size:32px;
    margin-bottom:8px;
}

.title p{
    color:#aaa;
}

.order-card{
    background:#0d151e;
    border:1px solid #273440;
    border-radius:10px;
    padding:20px;
    margin-bottom:20px;
}

.order-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #273440;
    padding-bottom:15px;
    margin-bottom:15px;
}

.order-id{
    color:#ffc107;
    font-weight:bold;
}

.status{
    background:#173d29;
    color:#55e88a;
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
}

.order-date{
    color:#999;
    font-size:13px;
    margin-bottom:15px;
}

.item{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    color:#ddd;
}

.item-name{
    font-weight:bold;
}

.item-qty{
    color:#999;
}

.order-total{
    border-top:1px solid #273440;
    margin-top:12px;
    padding-top:15px;
    display:flex;
    justify-content:space-between;
    font-size:18px;
    font-weight:bold;
}

.order-total span:last-child{
    color:#ffc107;
}

.empty{
    text-align:center;
    background:#0d151e;
    border:1px solid #273440;
    border-radius:10px;
    padding:50px 20px;
}

.empty h2{
    margin-bottom:10px;
}

.empty p{
    color:#999;
    margin-bottom:25px;
}

.btn{
    display:inline-block;
    background:#ffc107;
    color:#000;
    text-decoration:none;
    padding:12px 22px;
    border-radius:5px;
    font-weight:bold;
}

.btn:hover{
    background:#ffca2c;
}

footer{
    text-align:center;
    color:#777;
    padding:30px;
    margin-top:50px;
}

@media(max-width:650px){

    nav{
        padding:0 4%;
    }

    .nav-links{
        gap:12px;
    }

    .nav-links a{
        font-size:12px;
    }

    .logo{
        font-size:18px;
    }

    .order-top{
        align-items:flex-start;
        gap:10px;
    }
}
</style>
</head>

<body>

<nav>

    <div class="logo">
        🍛 Biryani <span>House</span>
    </div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="main.html">Menu</a>
        <a href="contact.html">Contact</a>
        <a href="profile.html">Profile</a>
    </div>

    <a href="cart.html" class="cart">
        🛒 Cart <span id="cartCount">0</span>
    </a>

</nav>


<div class="container">

    <div class="title">
        <h1>My Orders</h1>
        <p>View your previous Biryani House orders</p>
    </div>

    <div id="ordersContainer"></div>

</div>


<footer>
    © 2026 Biryani House. All Rights Reserved.
</footer>


<script>

function getOrders(){
    return JSON.parse(localStorage.getItem("biryaniOrders")) || [];
}

function updateCartCount(){

    const cart =
        JSON.parse(localStorage.getItem("biryaniCart")) || [];

    let count = 0;

    cart.forEach(item => {
        count += Number(item.quantity) || 1;
    });

    document.getElementById("cartCount").textContent = count;
}


function showOrders(){

    const orders = getOrders();

    const container =
        document.getElementById("ordersContainer");

    if(orders.length === 0){

        container.innerHTML = `
            <div class="empty">

                <h2>No Orders Yet</h2>

                <p>
                    You haven't placed any orders yet.
                </p>

                <a href="main.html" class="btn">
                    Browse Menu
                </a>

            </div>
        `;

        return;
    }


    container.innerHTML = "";


    orders.reverse().forEach((order,index)=>{

        let itemsHTML = "";

        order.items.forEach(item => {

            itemsHTML += `
                <div class="item">

                    <div>
                        <span class="item-name">
                            ${item.name}
                        </span>

                        <span class="item-qty">
                            × ${item.quantity}
                        </span>
                    </div>

                    <div>
                        ₹${item.price * item.quantity}
                    </div>

                </div>
            `;

        });


        container.innerHTML += `

            <div class="order-card">

                <div class="order-top">

                    <div class="order-id">
                        Order #${order.id || (1000 + index)}
                    </div>

                    <div class="status">
                        ${order.status || "Placed"}
                    </div>

                </div>


                <div class="order-date">
                    ${order.date || "Order date unavailable"}
                </div>


                ${itemsHTML}


                <div class="order-total">

                    <span>Total</span>

                    <span>
                        ₹${order.total || 0}
                    </span>

                </div>

            </div>

        `;

    });

}


updateCartCount();
showOrders();

</script>

</body>
</html>
